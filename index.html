<!doctype html>

<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon/icon-1024.png">
<link rel="icon" href="assets/images/icon/icon-1024.png">

<meta property="og:title" content="RACK UP">
<meta property="og:description" content="Billiard Score Board">
<meta property="og:image" content="assets/images/icon/icon-1024.png">
<meta property="og:url" content="https://playrackup.github.io/">
<meta property="og:type" content="website">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">

<title>RACK UP</title>

<link rel="stylesheet" href="assets/common/common.css">

<style>
html, body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
}

/* ── アプリシェル ──
   縦画面: 上はノッチ回避、左右は12px、下はホームバー回避
   横画面: 上下左右ともノッチ分だけ避ける（最小余白）
*/
.app {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  /* フォールバック */
  padding: 26px 12px 16px;
  /* safe-area対応端末で上書き */
  padding-top:    calc(var(--sat) + 12px);
  padding-right:  calc(var(--sar) + 12px);
  padding-bottom: calc(var(--sab) + 0px);
  padding-left:   calc(var(--sal) + 12px);
  gap: 8px;
  overflow: hidden;
}

.hero {
  -webkit-flex: 0 0 auto;
  flex: 0 0 auto;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: center;
  justify-content: center;
  gap: 4px;
  min-height: 0;
}

.logoRow {
  width: 100%;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  gap: 10px;
  min-height: 0;
}

.logoWrapper {
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 10px;
}

.logo {
  display: block;
  width: 60vw;
  max-width: 300px;
  max-height: 44px;
  object-fit: contain;
}

.heroAction { display: none; }

.tag {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .14em;
  color: var(--muted);
  text-transform: uppercase;
  line-height: 1;
}

.main {
  -webkit-flex: 1 1 auto;
  flex: 1 1 auto;
  min-height: 0;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
}

@supports (display: grid) {
  .main { display: grid; gap: 8px; }
}

.tile {
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-align-items: flex-start;
  align-items: flex-start;
  text-align: left;
  min-width: 0;
  min-height: 0;
  border-radius: var(--r-md);
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
  -webkit-transition: opacity .18s;
  transition: opacity .18s;
}

.tile:active { opacity: .8; }

.tileTitle {
  font-size: 18px;
  font-weight: 900;
  line-height: 1.08;
  word-break: break-word;
}

.tileSub {
  margin-top: 5px;
  font-size: 11px;
  line-height: 1.25;
  color: var(--muted);
}

.tileSoon {
  background: var(--panel-dim);
  border: 1px solid var(--line-dim);
}

.tileSoon .tileTitle { font-size: 16px; color: rgba(255,255,255,.83); }
.tileSoon .tileSub   { color: var(--muted3); }

.coming {
  display: inline-block;
  margin-left: 7px;
  font-size: 10px;
  font-weight: 900;
  color: rgba(255,207,102,.65);
  letter-spacing: .05em;
  vertical-align: middle;
}

.idTile {
  background: var(--idBg);
  border: 1px solid var(--idBorder);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 8px 22px rgba(0,0,0,.22);
}

.idTop   { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 10px; min-width: 0; }
.idBadge { -webkit-flex: 0 0 auto; flex: 0 0 auto; font-size: 22px; line-height: 1; }
.idTile .tileTitle { color: var(--idText); font-size: 19px; }
.idNote  { margin-top: 5px; font-size: 12px; line-height: 1.28; color: var(--idSub); }

.scoreTile { background: var(--scoreBg); border: 1px solid var(--scoreBorder); }
.scoreTile .tileTitle { font-size: 19px; }

.links {
  display: -webkit-flex;
  display: flex;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  gap: 12px 18px;
  -webkit-align-items: center;
  align-items: center;
  padding-top: 2px;
}

.link {
  font-size: 14px;
  color: var(--muted2);
  font-weight: 700;
  white-space: nowrap;
}

.heroCardBtn {
  display: -webkit-inline-flex;
  display: inline-flex;
  -webkit-align-items: center;
  align-items: center;
  gap: 9px;
  min-width: 0;
  max-width: 100%;
  padding: 8px 14px;
  border-radius: var(--r-md);
  background: var(--idBg);
  border: 1px solid var(--idBorder);
  color: var(--idText);
  font-weight: 900;
  font-size: 18px;
  line-height: 1;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 8px 22px rgba(0,0,0,.20);
  -webkit-transition: opacity .18s;
  transition: opacity .18s;
}

.heroCardBtn:active { opacity: .8; }
.heroCardBtn .mini  { font-size: 22px; line-height: 1; }
.heroCardBtn .label { white-space: nowrap; }

/* ============================================================
   縦画面
   グリッドを画面いっぱいに広げる
   ============================================================ */
@media (orientation: portrait) {
  @supports (display: grid) {
    .main {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: .90fr 1.2fr 1.2fr 1.2fr auto;
      gap: 8px;
    }
  }

  .portrait-id-row {
    display: -webkit-flex;
    display: flex;
    gap: 8px;
    width: 100%;
    min-height: 0;
    grid-column: 1 / 3;
    grid-row: 1 / 2;
  }

  @supports (display: grid) {
    .portrait-id-row { display: grid; grid-template-columns: 1fr 2fr; }
  }

  .portrait-id-row .shareBtn {
    display: -webkit-flex !important;
    display: flex !important;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 8px;
    font-size: 13px;
    gap: 4px;
  }

  .portrait-id-row .idTile {
    margin: 0;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-justify-content: center;
    justify-content: center;
  }

  .scoreTile     { grid-column: 1 / 2; grid-row: 2 / 3; }
  .pairTile      { grid-column: 2 / 3; grid-row: 2 / 3; }
  .rotationTile  { grid-column: 1 / 2; grid-row: 3 / 4; }
  .japanTile     { grid-column: 2 / 3; grid-row: 3 / 4; }
  .bowlliardTile { grid-column: 1 / 2; grid-row: 4 / 5; }
  .drillTile     { grid-column: 2 / 3; grid-row: 4 / 5; }
  .links         { grid-column: 1 / 3; grid-row: 5 / 6; }

  .tile { padding: 14px; }
  .tileSoon, .scoreTile { -webkit-justify-content: center; justify-content: center; }
}

/* ============================================================
   横画面
   上下左右ともノッチ分だけ避けて最小余白
   ============================================================ */
@media (orientation: landscape) {

  .portrait-id-row { display: none; }

  .app {
    /* フォールバック */
    padding: 6px 50px;
    /* safe-area分だけ避けて余白は最小限 */
    padding-top:    calc(var(--sat) + 4px);
    padding-right:  calc(var(--sar) + 4px);
    padding-bottom: calc(var(--sab) + 4px);
    padding-left:   calc(var(--sal) + 4px);
    gap: 6px;
  }

  .hero    { -webkit-align-items: stretch; align-items: stretch; gap: 2px; }
  .logoRow { padding: 0; }
  .logo    { width: 22vw; max-width: 190px; max-height: 38px; -webkit-flex: 0 0 auto; flex: 0 0 auto; margin-left: -8px; }
  .tag     { -webkit-flex: 0 0 auto; flex: 0 0 auto; white-space: nowrap; }

  .heroAction {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: flex-end;
    justify-content: flex-end;
    -webkit-flex: 1 1 auto;
    flex: 1 1 auto;
    margin-left: auto;
  }

  .heroAction .shareBtn { margin-right: 30px; padding: 8px 16px; font-size: 15px; }
  .idTile { display: none; }

  @supports (display: grid) {
    .main {
      grid-template-columns: 1.08fr 1fr 1fr;
      grid-template-rows: 1fr 1fr auto;
      gap: 8px;
    }
  }

  .scoreTile     { grid-column: 1 / 2; grid-row: 1 / 2; }
  .pairTile      { grid-column: 2 / 3; grid-row: 1 / 2; }
  .rotationTile  { grid-column: 3 / 4; grid-row: 1 / 2; }
  .japanTile     { grid-column: 1 / 2; grid-row: 2 / 3; }
  .bowlliardTile { grid-column: 2 / 3; grid-row: 2 / 3; }
  .drillTile     { grid-column: 3 / 4; grid-row: 2 / 3; }
  .links         { grid-column: 1 / 4; grid-row: 3 / 4; gap: 12px 26px; }

  .tile                 { padding: 14px; border-radius: 18px; min-height: 0; }
  .tileTitle            { font-size: 21px; }
  .scoreTile .tileTitle { font-size: 22px; }
  .tileSoon .tileTitle  { font-size: 18px; }
  .tileSub              { font-size: 12px; }
  .coming               { display: block; margin: 6px 0 0; font-size: 10px; }
  .link                 { font-size: 15px; }
}

@media (max-height: 740px) {
  .logo { max-height: 40px; }
  .main { gap: 7px; }
  .tile { padding: 12px; }
  .tileTitle { font-size: 16px; }
  .heroCardBtn, .heroAction .shareBtn { font-size: 16px; padding: 7px 12px; }
}
</style>

</head>
<body>
<div class="app">

  <header class="hero">
    <div class="logoRow">
      <div class="logoWrapper">
        <img src="assets/images/logo/rack_up_logo.png" alt="RACK UP" class="logo">
        <p class="tag">Pool Tools</p>
      </div>
      <div class="heroAction">
        <button class="shareBtn" onclick="openShareModal()">
          <span>🔗</span><span>App Share</span>
        </button>
        <a id="heroCardLink" class="heroCardBtn" href="rackup/id/">
          <span class="mini">🆔</span>
          <span class="label" id="heroCardLabel">My ID</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="portrait-id-row">
      <button class="shareBtn" onclick="openShareModal()">
        <span style="font-size:20px">🔗</span>
        <span>App Share</span>
      </button>
      <a id="mainCardLink" class="tile idTile" href="rackup/id/">
        <div class="idTop">
          <span class="idBadge">🆔</span>
          <div class="tileTitle" id="mainCardLabel">My ID</div>
        </div>
        <div class="idNote" id="mainCardNote">My IDで記録し共有しよう。</div>
      </a>
    </div>

    <a class="tile scoreTile" href="score/">
      <div class="tileTitle">スコアボード</div>
      <div class="tileSub">ホーム画面に追加推奨</div>
    </a>
    <a class="tile tileSoon pairTile" href="rackup/pair/">
      <div class="tileTitle">ペアマッチ <span class="coming">COMING SOON</span></div>
      <div class="tileSub">準備中</div>
    </a>
    <a class="tile tileSoon rotationTile" href="rackup/rotation/">
      <div class="tileTitle">ローテーション <span class="coming">COMING SOON</span></div>
      <div class="tileSub">準備中</div>
    </a>
    <a class="tile tileSoon japanTile" href="rackup/japan9/">
      <div class="tileTitle">ジャパンナインボール <span class="coming">COMING SOON</span></div>
      <div class="tileSub">準備中</div>
    </a>
    <a class="tile tileSoon bowlliardTile" href="rackup/bowlliard/">
      <div class="tileTitle">ボーラード <span class="coming">COMING SOON</span></div>
      <div class="tileSub">準備中</div>
    </a>
    <a class="tile tileSoon drillTile" href="rackup/drill/">
      <div class="tileTitle">ドリルメーカー <span class="coming">COMING SOON</span></div>
      <div class="tileSub">準備中</div>
    </a>

    <div class="links">
      <a class="link" href="rackup/readme/">README / 使い方</a>
      <a class="link" href="rackup/contact/">問い合わせ</a>
      <a class="link" href="rackup/links/">リンク集</a>
      <a class="link" href="https://nabechaya.example.com">nabechaya</a>
    </div>
  </main>

</div>

<!-- シェアモーダル -->
<div class="modalBack" id="shareModal" onclick="closeShareModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modalLogoWrap">
      <img src="assets/images/logo/rack_up_logo.png" alt="RACK UP" class="modalLogo">
      <div class="by-text">by nabechaya</div>
    </div>
    <div class="qrContainer">
      <img id="qrCodeImg" src="" alt="QR Code">
    </div>
    <div class="modalInfo">
      <div class="mainT">ADD TO HOME SCREEN TO USE 🎱</div>
      <div class="subT">共有ボタンからホーム画面に追加して使ってね</div>
    </div>
    <button class="btnPrimaryShare" onclick="execShare()">COPY URL / SHARE</button>
    <button class="btnCloseShare" onclick="closeShareModal()">CLOSE</button>
  </div>
</div>

<script src="assets/common/common.js"></script>

<script>
  var SHARE_URL = 'https://playrackup.github.io/';

  function openShareModal() {
    var modal = document.getElementById('shareModal');
    var qrImg = document.getElementById('qrCodeImg');
    qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(SHARE_URL);
    modal.style.display = 'flex';
  }

  function closeShareModal() {
    document.getElementById('shareModal').style.display = 'none';
  }

  function execShare() {
    if (navigator.share) {
      navigator.share({ title: 'RACK UP', text: 'ビリヤードスコア管理アプリ RACK UP', url: SHARE_URL })
        .catch(function() {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(SHARE_URL)
        .then(function() { alert('URLをコピーしました！'); })
        .catch(function() { alert('共有できませんでした'); });
    } else {
      prompt('URLをコピーしてください', SHARE_URL);
    }
  }

  (function() {
    var ID_KEY    = 'rackupProfileV5';
    var heroLink  = document.getElementById('heroCardLink');
    var heroLabel = document.getElementById('heroCardLabel');
    var mainLink  = document.getElementById('mainCardLink');
    var mainLabel = document.getElementById('mainCardLabel');
    var mainNote  = document.getElementById('mainCardNote');

    function hasMyId() {
      try {
        var raw = localStorage.getItem(ID_KEY);
        if (!raw) return false;
        var d = JSON.parse(raw);
        return !!(d && d.id);
      } catch(e) { return false; }
    }

    function applyCardState() {
      var created = hasMyId();
      var path  = created ? 'rackup/mycard/' : 'rackup/id/';
      var label = created ? 'My Card'        : 'My ID 作成';
      var note  = created ? 'プロフィールや記録を確認できます。' : 'My IDを作成しましょう。';
      if (heroLink)  heroLink.href = path;
      if (heroLabel) heroLabel.textContent = label;
      if (mainLink)  mainLink.href = path;
      if (mainLabel) mainLabel.textContent = label;
      if (mainNote)  mainNote.textContent = note;
    }

    

    applyCardState();
  }());

  /* bfcache復元時にリロード（ホーム専用）
     スコアで向きを変えて戻った時のレイアウト崩れを防ぐ */
  window.addEventListener('pageshow', function(e) {
    if (e.persisted) {
      window.location.reload();
    }
  });





  
</script>

</body>
</html>
