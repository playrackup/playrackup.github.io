<!doctype html>

<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/icon/icon-1024.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RACK UP">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>RACK UP | スコアボード</title>

  <link rel="stylesheet" href="../assets/common/common.css">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

  <style>
    :root { --score-font: 'Oswald', sans-serif; }

    html, body {
      margin: 0; padding: 0;
      height: 100dvh; width: 100vw;
      background: #0b0b0c;
      overflow: hidden; position: fixed;
      color: #fff;
      display: flex; flex-direction: column;
    }

    * { -webkit-user-select: none; user-select: none; box-sizing: border-box; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 6px;
      padding-left:  calc(env(safe-area-inset-left)  + 6px);
      padding-right: calc(env(safe-area-inset-right) + 6px);
      padding-top:   calc(env(safe-area-inset-top)   + 56px + 6px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 6px);
      min-height: 0;
      position: relative;
    }

    .cards { display: grid; gap: 6px; width: 100%; height: 100%; }

    .card {
      position: relative;
      background: #121216; border: 1px solid #2a2a33;
      border-radius: 28px; overflow: hidden;
      display: flex; flex-direction: column;
      min-height: 0;
    }

    .cardHeader {
      display: flex; justify-content: space-between;
      align-items: flex-start;
      z-index: 2; pointer-events: none; padding: 12px;
    }

    .playerName { font-weight: 1000; text-shadow: 0 4px 12px rgba(0,0,0,.9); font-size: 20px; }

    .metaRight { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font-size: 11px; font-weight: bold; }

    .winsPill {
      background: rgba(255,255,255,.08); padding: 4px 10px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,.1);
      color: #ccc; text-align: right; line-height: 1.2;
    }

    .totalWinsLabel {
      background: linear-gradient(to right, #f2994a, #f2c94c);
      -webkit-background-clip: text; color: transparent; font-weight: 1000;
    }

    .scoreWrap { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; pointer-events: none; }
    .score { font-weight: 1000; line-height: 0.8; font-family: var(--score-font); text-shadow: 0 0 40px rgba(0,0,0,.6); }

    @media (orientation: portrait) {
      .count2 .score { font-size: 38svh; }
      .count3 .score { font-size: 24svh; }
      .count4 .score { font-size: 19svh; }
      .cards.count4  { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }
    }

    @media (orientation: landscape) {

      .cards.count2 { grid-template-rows: 1fr; grid-template-columns: 1fr 1fr; }
      .cards.count3 { grid-template-rows: 1fr; grid-template-columns: 1fr 1fr 1fr; }

      .cards.count4 { grid-template-rows: 1fr 1fr; grid-template-columns: 1fr 1fr; }
      .count2 .score { font-size: 60svh; }
      .count3 .score { font-size: 50svh; }
      .count4 .score { font-size: 30svh; }
      .cardHeader { padding: 10px 20px; }
      .playerName { font-size: 28px; }
    }

    .card.reach { border: 3px solid #ff4444; animation: reachPulse 1.5s infinite; }
    @keyframes reachPulse {
      0%,100% { box-shadow: inset 0 0 20px #ff0000; }
      50%     { box-shadow: inset 0 0 50px #ff0000; }
    }

    #hillHillOverlay {
      position: absolute; inset: 0; display: none;
      z-index: 5; pointer-events: none;
      background: rgba(255,0,0,.1);
      animation: flash .5s infinite alternate;
    }
    @keyframes flash { from { opacity: .1; } to { opacity: .3; } }

    .winnerOverlay {
      position: absolute; inset: 0; display: none;
      place-content: center; place-items: center;
      z-index: 10; pointer-events: none;
    }
    .winnerOverlay::before {
      content: ""; position: absolute; inset: -55%;
      background: conic-gradient(from 0deg,#ff0078,#ffd200,#00ffaa,#00a0ff,#b400ff,#ff0078);
      filter: blur(40px); animation: swirl .8s linear infinite; opacity: .6;
    }
    .winnerText {
      position: relative; font-weight: 1000;
      font-size: clamp(20px,8vw,40px);
      padding: 10px 24px; border-radius: 999px;
      border: 4px solid #fff; background: rgba(0,0,0,.8);
      text-shadow: 0 0 20px #fff; white-space: nowrap;
    }
    .card.win .winnerOverlay { display: grid; }
    .card.win.shaking .winnerText { animation: winShaking .1s infinite, rainbowText .5s infinite; }
    @keyframes winShaking {
      0%   { transform: translate(2px,2px) rotate(0deg); }
      50%  { transform: translate(-2px,-2px) rotate(1deg); }
      100% { transform: translate(2px,2px) rotate(0deg); }
    }
    @keyframes rainbowText {
      0%   { color:#ff0078; border-color:#ff0078; }
      25%  { color:#ffd200; border-color:#ffd200; }
      50%  { color:#00ffaa; border-color:#00ffaa; }
      75%  { color:#00a0ff; border-color:#00a0ff; }
      100% { color:#ff0078; border-color:#ff0078; }
    }
    @keyframes swirl { to { transform: rotate(360deg); } }

    .continueOverlay {
      position: fixed; inset: 0; z-index: 20000;
      display: none; align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
    }
    .continueOverlay.show { display: flex; }

    .continueSheet {
      width: 100%; max-width: 440px;
      background: #18191f;
      border-radius: 28px 28px 24px 24px;
      padding: 24px 20px 20px;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 -20px 50px rgba(0,0,0,.5);
      display: flex; flex-direction: column; gap: 10px;
    }

    .continueTitle {
      text-align: center;
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,.45);
      letter-spacing: .1em; text-transform: uppercase;
      margin-bottom: 4px;
    }

    .btnContinue {
      width: 100%; padding: 22px; border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #0a0800;
      font-size: 22px; font-weight: 1000;
      letter-spacing: .04em; cursor: pointer;
      box-shadow: var(--shadow-gold);
      font-family: var(--font-ui);
      transition: transform .15s, opacity .15s;
    }
    .btnContinue:active { transform: scale(.97); opacity: .88; }

    .btnShareResult {
      width: 100%; padding: 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.55);
      font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: var(--font-ui);
      transition: opacity .15s;
    }
    .btnShareResult:active { opacity: .6; }

    .settingsModal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.94);
      display: none; align-items: center; justify-content: center;
      z-index: 10000; padding: 20px;
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    }

    .settingsInner {
      width: 100%; max-width: 400px;
      background: #18181f; border-radius: 32px;
      padding: 24px; border: 1px solid #333;
      max-height: 90vh; overflow-y: auto;
    }

    .countBtns { display: flex; gap: 6px; margin-bottom: 20px; }
    .countBtn {
      flex: 1; background: #1e1e24; color: #fff;
      border: 1px solid #2a2a33; border-radius: var(--r-sm);
      padding: 10px 14px; font-size: 14px; font-weight: bold; cursor: pointer;
      font-family: var(--font-ui);
    }
    .countBtn.active { background: #333; }

    .inputRow {
      display: flex; gap: 10px; margin-bottom: 12px;
      align-items: center; background: #000;
      padding: 6px 12px; border-radius: var(--r-md); border: 1px solid #222;
    }
    .inputRow input {
      background: transparent; border: none; color: #fff;
      padding: 10px; font-size: 18px; width: 100%;
      font-weight: bold; outline: none;
      -webkit-user-select: text; user-select: text;
    }

    .btnSave {
      background: #007aff; border: none; padding: 18px;
      font-weight: 1000; width: 100%; border-radius: var(--r-lg);
      margin-top: 10px; font-size: 16px; color: #fff;
      cursor: pointer; font-family: var(--font-ui);
    }
    .btnClose {
      background: #2a2a33; border: none; padding: 18px;
      font-weight: 1000; width: 100%; border-radius: var(--r-lg);
      margin-top: 10px; font-size: 16px; color: #fff;
      cursor: pointer; font-family: var(--font-ui);
    }

    .resetGroup {
      margin-top: 25px; padding-top: 20px;
      border-top: 1px solid #333; display: grid; gap: 10px;
    }
    .btnReset {
      background: #1a1a1a; border: 1px solid #4a2a2a;
      color: #ff6b6b; padding: 15px; border-radius: var(--r-md);
      font-weight: bold; width: 100%; cursor: pointer; font-family: var(--font-ui);
    }
    .btnReset.factory { background: #4a1a1a; border-color: #ff4444; color: #fff; }

    #resetConfirmUI { display: none; text-align: center; }
    .confirmTitle { font-size: 24px; font-weight: 1000; color: #ff4444; margin-bottom: 20px; }
    .confirmBtns { display: flex; gap: 12px; }
    .btnConfirmYes {
      flex: 1; background: #ff4444; color: #fff; border: none;
      border-radius: var(--r-md); padding: 20px;
      font-weight: 1000; cursor: pointer; font-family: var(--font-ui);
    }
    .btnConfirmNo {
      flex: 1; background: #333; border: none;
      border-radius: var(--r-md); color: #fff; padding: 20px;
      font-weight: 1000; cursor: pointer; font-family: var(--font-ui);
    }

    .satOverlay {
      position: fixed; inset: 0; z-index: 21000;
      display: none; align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
    }
    .satOverlay.show { display: flex; }

    .satSheet {
      width: 100%; max-width: 440px;
      background: #18191f;
      border-radius: 28px 28px 24px 24px;
      padding: 22px 20px 20px;
      border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 -20px 50px rgba(0,0,0,.5);
    }

    .satTitle {
      font-size: 13px; font-weight: 800;
      color: var(--gold); letter-spacing: .1em;
      text-transform: uppercase; margin-bottom: 14px;
      text-align: center;
    }

    .satGrid {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 16px; justify-content: center;
    }

    .satChip {
      padding: 8px 16px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.6);
      font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: var(--font-ui);
      transition: all .15s;
    }
    .satChip.selected {
      background: rgba(126,224,255,.15);
      border-color: rgba(126,224,255,.4);
      color: var(--felt-blue);
    }

    .gamesRow {
      display: flex; align-items: center;
      gap: 12px; margin-bottom: 16px;
      justify-content: center;
    }
    .gamesLabel { font-size: 14px; color: var(--muted); font-weight: 700; }
    .gamesInput {
      width: 70px; height: 44px;
      background: var(--panel-2); border: 1px solid var(--line-2);
      border-radius: var(--r-sm); color: #fff;
      font-size: 20px; font-weight: 900;
      text-align: center; outline: none;
      -webkit-user-select: text; user-select: text;
    }

    .btnGenQR {
      width: 100%; padding: 18px; border: none;
      border-radius: var(--r-lg);
      background: linear-gradient(135deg, var(--felt-blue), #a8ffd7);
      color: #061218; font-size: 17px; font-weight: 900;
      cursor: pointer; font-family: var(--font-ui);
    }
  </style>

</head>
<body>

  <main id="appMain">
    <div id="hillHillOverlay"></div>
    <div class="cards" id="cardsContainer"></div>
  </main>

  <div class="continueOverlay" id="continueOverlay">
    <div class="continueSheet">
      <div class="continueTitle" id="continueLabel">WINNER</div>
      <button class="btnContinue" onclick="doContinue()">CONTINUE</button>
      <button class="btnShareResult" onclick="doOpenSat()">結果をシェア</button>
    </div>
  </div>

  <div class="satOverlay" id="satOverlay">
    <div class="satSheet">
      <div class="satTitle">この試合は？</div>
      <div class="satGrid" id="satGrid"></div>
      <div class="gamesRow">
        <div class="gamesLabel">試合数</div>
        <input class="gamesInput" id="gamesInput" type="number" min="1" value="1">
      </div>
      <button class="btnGenQR" onclick="doGenQR()">QRを生成する</button>
    </div>
  </div>

  <div class="settingsModal" id="settingsModal" onclick="closeSettings()">
    <div class="settingsInner" onclick="event.stopPropagation()">
      <div id="mainSettingsUI">
        <div class="countBtns">
          <button id="b2" class="countBtn" onclick="changeCount(2)">2P</button>
          <button id="b3" class="countBtn" onclick="changeCount(3)">3P</button>
          <button id="b4" class="countBtn" onclick="changeCount(4)">4P</button>
        </div>
        <div id="playerInputs"></div>
        <button class="btnSave" onclick="applySettings()">SAVE CHANGES</button>
        <div class="resetGroup">
          <button class="btnReset" onclick="showResetConfirm('score')">RESET SCORES ONLY</button>
          <button class="btnReset" onclick="showResetConfirm('all')">RESET SCORES & WINS</button>
          <button class="btnReset factory" onclick="showResetConfirm('factory')">FACTORY RESET</button>
        </div>
        <button class="btnClose" onclick="closeSettings()">CLOSE</button>
      </div>
      <div id="resetConfirmUI">
        <div class="confirmTitle">ARE YOU SURE?</div>
        <p id="resetMsgEN" style="font-size:16px;color:#fff;margin-bottom:4px;font-weight:bold;"></p>
        <p id="resetMsgJP" style="font-size:13px;color:#ccc;margin-bottom:30px;"></p>
        <div class="confirmBtns">
          <button id="confirmYesBtn" class="btnConfirmYes">YES, RESET</button>
          <button class="btnConfirmNo" onclick="hideResetConfirm()">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <!--
    読み込み順序（重要）:
    1. LZString — result-qr.js が使うので必ず先に
    2. common.js — createHeader を提供
    3. result-qr.js — ResultQR.show を提供
  -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

  <script src="../assets/common/common.js"></script>

  <script src="../assets/common/result-qr.js"></script>

  <script>
    const KEY = "pool_score_v29";
    let state = { playerCount: 2, players: [], winnerId: null };
    const $ = (id) => document.getElementById(id);

    window.addEventListener('resize', renderAll);

    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

    function load() {
      const data = localStorage.getItem(KEY);
      if (data) {
        state = JSON.parse(data);
      } else {
        for (let i = 1; i <= 4; i++) {
          state.players.push({ id: i, name: `Player ${i}`, score: 0, wins: 0, race: 5 });
        }
      }
      renderAll();
    }

    function renderAll() {
      const container = $("cardsContainer");
      if (!container) return;
      container.innerHTML = "";
      container.className = `cards count${state.playerCount}`;

      let reachCount = 0;
      const activePlayers = state.players.slice(0, state.playerCount);

      activePlayers.forEach(p => {
        const card = document.createElement("div");
        const isReach  = p.score === p.race - 1 && !state.winnerId;
        const isWinner = state.winnerId === p.id;
        if (isReach) reachCount++;

        card.className = "card" + (isWinner ? " win" : "") + (isReach ? " reach" : "");
        card.innerHTML = `
          <div class="cardHeader">
            <div class="playerName">${p.name}</div>
            <div class="metaRight">
              <span class="winsPill">${state.playerCount >= 3 ? `RACE<br>TO:${p.race}` : `RACE TO: ${p.race}`}</span>
              <span class="totalWinsLabel">${state.playerCount >= 3 ? `WINS:${p.wins}` : `WINS: ${p.wins}`}</span>
            </div>
          </div>
          <div class="scoreWrap"><div class="score">${p.score}</div></div>
          <div class="winnerOverlay"><div class="winnerText">WINNER!!!</div></div>
        `;
        attachEvents(card, p.id);
        container.appendChild(card);
      });

      $("hillHillOverlay").style.display =
        (reachCount === state.playerCount && state.playerCount > 1) ? "block" : "none";

      const inputWrap = $("playerInputs");
      inputWrap.innerHTML = "";
      activePlayers.forEach(p => {
        const row = document.createElement("div");
        row.className = "inputRow";
        row.innerHTML = `
          <input type="text" id="inP${p.id}Name" value="${p.name}">
          <span style="font-size:10px;color:#555;white-space:nowrap">Race to</span>
          <input type="number" id="inP${p.id}Race" value="${p.race}" style="width:50px">
        `;
        inputWrap.appendChild(row);
      });

      [2,3,4].forEach(n => {
        const btn = $(`b${n}`);
        if (btn) btn.className = "countBtn" + (state.playerCount === n ? " active" : "");
      });
    }

    function handleScore(id, delta) {
      if (state.winnerId) {
        showContinueSheet();
        return;
      }
      const p = state.players.find(x => x.id === id);
      p.score = Math.max(0, p.score + delta);
      if (p.score >= p.race && delta > 0) {
        state.winnerId = id;
        save();
        renderAll();
        setTimeout(() => {
          const winCard = document.querySelector('.card.win');
          if (winCard) winCard.classList.add('shaking');
          setTimeout(() => showContinueSheet(), 1500);
        }, 100);
        return;
      }
      save();
      renderAll();
    }

    function showContinueSheet() {
      const winner = state.players.find(p => p.id === state.winnerId);
      if (winner) $("continueLabel").textContent = `🏆 ${winner.name} WIN!`;
      $("continueOverlay").classList.add("show");
    }

    function hideContinueSheet() {
      $("continueOverlay").classList.remove("show");
    }

    function doContinue() {
      hideContinueSheet();
      state.players.forEach(p => {
        if (p.id === state.winnerId) p.wins++;
        p.score = 0;
      });
      state.winnerId = null;
      save();
      renderAll();
    }

    function doOpenSat() {
      hideContinueSheet();
      buildSatGrid();
      $("satOverlay").classList.add("show");
    }

    const SAT_TAGS = [
      { key: "fun",     label: "楽しかった 😄" },
      { key: "learn",   label: "学びあった 📚" },
      { key: "close",   label: "接戦だった ⚡" },
      { key: "rematch", label: "またやりたい 🔥" },
      { key: "reflect", label: "反省点あり 🤔" }
    ];

    let selectedSat = [];

    function buildSatGrid() {
      selectedSat = [];
      const grid = $("satGrid");
      grid.innerHTML = "";
      SAT_TAGS.forEach(t => {
        const chip = document.createElement("button");
        chip.className = "satChip";
        chip.textContent = t.label;
        chip.onclick = () => {
          const idx = selectedSat.indexOf(t.key);
          if (idx === -1) {
            selectedSat.push(t.key);
            chip.classList.add("selected");
          } else {
            selectedSat.splice(idx, 1);
            chip.classList.remove("selected");
          }
        };
        grid.appendChild(chip);
      });
      $("gamesInput").value = 1;
    }

    function doGenQR() {
      $("satOverlay").classList.remove("show");
      const activePlayers = state.players.slice(0, state.playerCount);
      const games = parseInt($("gamesInput").value) || 1;
      const players = activePlayers.map(p => ({
        n:  p.name,
        s:  p.score,
        w:  p.wins,
        r:  p.race,
        wn: p.id === state.winnerId ? 1 : 0
      }));
      ResultQR.show({
        mode:         "score",
        players:      players,
        games:        games,
        satisfaction: selectedSat
      });
      state.players.forEach(p => {
        if (p.id === state.winnerId) p.wins++;
        p.score = 0;
      });
      state.winnerId = null;
      save();
      renderAll();
    }

    function openSettings()  { hideResetConfirm(); $("settingsModal").style.display = "flex"; }
    function closeSettings() { $("settingsModal").style.display = "none"; }

    function applySettings() {
      state.players.slice(0, state.playerCount).forEach(p => {
        p.name = $(`inP${p.id}Name`).value || p.name;
        p.race = parseInt($(`inP${p.id}Race`).value) || p.race;
      });
      save(); closeSettings(); renderAll();
    }

    function changeCount(n) { state.playerCount = n; renderAll(); }

    function showResetConfirm(type) {
      $("mainSettingsUI").style.display = "none";
      $("resetConfirmUI").style.display = "block";
      const btn   = $("confirmYesBtn");
      const msgEN = $("resetMsgEN");
      const msgJP = $("resetMsgJP");

      if (type === 'score') {
        msgEN.innerHTML = "Reset scores";
        msgJP.innerHTML = "スコアのみリセットします";
        btn.onclick = () => { state.players.forEach(p => p.score = 0); state.winnerId = null; save(); renderAll(); closeSettings(); };
      } else if (type === 'all') {
        msgEN.innerHTML = "Reset scores & Wins";
        msgJP.innerHTML = "スコアとWins(累計)の両方をリセットします";
        btn.onclick = () => { state.players.forEach(p => { p.score = 0; p.wins = 0; }); state.winnerId = null; save(); renderAll(); closeSettings(); };
      } else {
        msgEN.innerHTML = "Factory reset (all reset)";
        msgJP.innerHTML = "全ての名前と履歴が消去されます";
        btn.onclick = () => { localStorage.removeItem(KEY); location.reload(); };
      }
    }

    function hideResetConfirm() {
      $("mainSettingsUI").style.display = "block";
      $("resetConfirmUI").style.display = "none";
    }

    function attachEvents(el, id) {
      let sx, sy;
      el.addEventListener('touchstart', e => {
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });
      
      el.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - sx;
  var dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 15 && Math.abs(dy) < 15) handleScore(id, 1);
  else if (Math.abs(dx) > Math.abs(dy)) handleScore(id, dx > 40 ? 1 : (dx < -80 ? -1 : 0));
  else handleScore(id, dy > 80 ? -1 : (dy < -40 ? 1 : 0));
}, { passive: true });      
      
    }

    createHeader({
      showBack:     true,
      showSound:    true,
      showSettings: true,
      onSettings:   () => openSettings()
    });

    load();

/* スコアページをbfcacheから除外
   これによりホームに戻る時は必ず新規読み込みになる */
window.addEventListener('pagehide', function(e) {
  if (e.persisted) {
    location.replace('/');
  }
});




    
  </script>
